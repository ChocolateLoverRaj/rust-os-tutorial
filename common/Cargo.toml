[package]
name = "common"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bincode = { version = "2.0.1", default-features = false, features = ["derive"] }
bitflags = "2.9.1"
elf = { version = "0.8.0", default-features = false }
embedded-graphics = "0.8.1"
ez_paging = { version = "0.1.0", path = "../../../ez_paging" }
limine = { version = "0.5.0", optional = true }
log = { git = "https://github.com/ChocolateLoverRaj/log", branch = "bincode", version = "0.4.27", features = [
    "bincode",
] }
thiserror = { version = "2.0.12", default-features = false }
x86_64 = { git = "https://github.com/rust-osdev/x86_64", branch = "next" }
zerocopy = { version = "0.8.25", features = ["derive"] }

[features]
user_mode = []
kernel = ["dep:limine"]
default = ["user_mode", "kernel"]
