[package]
name = "user_mode_program"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "user_mode_program"
test = false
bench = false

[dependencies]
common = { version = "0.1.0", path = "../common", default-features = false, features = [
    "user_mode",
] }
elf = { version = "0.8.0", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ["alloc", "async-await"] }
heapless = "0.8.0"
lock_api = "0.4.13"
pc-keyboard = "0.8.0"
ps2-mouse = { git = "https://github.com/ChocolateLoverRaj/ps2-mouse", branch = "minimal" }
spin = "0.10.0"
talc = { version = "4.4.2", features = ["counters"] }
user_lib = { version = "0.1.0", path = "../user_lib" }
x86_64 = "0.15.2"
