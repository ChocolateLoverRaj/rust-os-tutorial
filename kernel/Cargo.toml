[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
abi = { version = "0.1.0", path = "../abi" }
acpi = "6.0.1"
atomic_enum = "0.3.0"
bitflags = "2.9.4"
console = { git = "https://github.com/console-rs/console", rev = "a51fcead7cda1fc6f5ac552a5588aaba8c069639", version = "0.16.0", default-features = false, features = ["ansi-parsing"] }
either = { version = "1.15.0", default-features = false }
elf = { version = "0.8.0", default-features = false }
embedded-graphics = "0.8.1"
ez_paging = { git = "https://github.com/ChocolateLoverRaj/ez_paging", version = "0.1.0", default-features = false }
force-send-sync = { git = "https://github.com/ChocolateLoverRaj/force-send-sync", branch = "no_std", version = "1.1.0" }
itertools = { version = "0.14.0", default-features = false }
limine = "0.4"
log = "0.4.27"
nodit = { version = "0.9.2", default-features = false }
num_enum = { version = "0.7.4", default-features = false }
owo-colors = "4.2.1"
raw-cpuid = "11.6.0"
spin = "0.10.0"
spinning_top = { version = "0.3.0", features = ["arc_lock"] }
talc = "4.4.3"
uart = { git = "https://github.com/ChocolateLoverRaj/uart", branch = "send-sync", version = "2.0.0" }
uart_16550 = "0.3.2"
unicode-segmentation = "1.12.0"
x2apic = { git = "https://github.com/ChocolateLoverRaj/x2apic-rs", version = "0.5.0" }
x86_64 = { git = "https://github.com/rust-osdev/x86_64", branch = "next" }

[[bin]]
name = "kernel"
test = false
bench = false
