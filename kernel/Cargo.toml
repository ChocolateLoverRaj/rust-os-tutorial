[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
acpi = "5.2.0"
atomic_enum = "0.3.0"
bitfield = "0.19.1"
bitflags = "2.9.1"
common = { version = "0.1.0", path = "../common", default-features = false, features = [
    "kernel",
] }
console = { git = "https://github.com/console-rs/console", rev = "a51fcead7cda1fc6f5ac552a5588aaba8c069639", default-features = false, features = [
    "ansi-parsing",
] }
crossbeam-queue = { version = "0.3.12", default-features = false, features = [
    "alloc",
] }
debug-ignore = "1.0.5"
elf = { version = "0.8.0", default-features = false }
embedded-graphics = "0.8.1"
ez_hpet = "1.0.0"
ez_pci = "1.1.0"
ez_xhci = { git = "https://github.com/ChocolateLoverRaj/ez_xhci", version = "0.1.0" }
force-send-sync = { git = "https://github.com/ChocolateLoverRaj/force-send-sync", branch = "no_std", version = "1.1.0" }
itertools = { version = "0.14.0", default-features = false }
limine = "0.5"
log = { version = "0.4.27", features = ["bincode", "serde"] }
nodit = "0.9.2"
num_enum = { version = "0.7.3", default-features = false }
owo-colors = "4.2.1"
polished_pci = { path = "../../../polished-os/pci", default-features = false, features = [
    "logger_log",
] }
ps2 = "0.2.0"
raw-cpuid = "11.5.0"
ron = { git = "https://github.com/ron-rs/ron", version = "0.10.1", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
spin = "0.10.0"
talc = "4.4.2"
thiserror = { version = "2.0.12", default-features = false }
uart = { git = "https://github.com/ChocolateLoverRaj/uart", branch = "send-sync" }
uart_16550 = "0.3.2"
unicode-segmentation = "1.12.0"
volatile = { version = "0.6.1", features = ["derive", "unstable"] }
x2apic = { git = "https://github.com/ChocolateLoverRaj/x2apic-rs", branch = "main" }
x86_64 = { git = "https://github.com/rust-osdev/x86_64", branch = "next" }
zerocopy = "0.8.26"

[[bin]]
name = "kernel"
test = false
bench = false
